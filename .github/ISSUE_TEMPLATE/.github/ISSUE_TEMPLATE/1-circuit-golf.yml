name: "Submit: Quantum Circuit Golf"
description: Optimization / Circuits challenge
title: "[Circuit Golf] "
labels: ["submission", "circuit-golf"]
body:
  - type: markdown
    attributes:
      value: |
        **Deadline: Sunday, November 22, 11:00 AM ET.** One submission per team.
        We'll judge what's on your repository's main branch at the deadline, so you can keep pushing until then.

  - type: dropdown
    id: track
    attributes:
      label: Track
      options:
        - Quantum Circuit Golf
      default: 0
    validations:
      required: true

  - type: input
    id: team
    attributes:
      label: Team name
    validations:
      required: true

  - type: textarea
    id: members
    attributes:
      label: Team members
      description: One per line.
    validations:
      required: true

  - type: input
    id: repo
    attributes:
      label: Repository URL
      description: Make it public so the judges can open it.
      placeholder: https://github.com/your-team/your-repo
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations
      description: From the Circuit Golf technical instructions.
      options:
        - label: "Our repository contains `submission.py` (defining `optimize(circuit, config)`), our dependencies, run instructions, and the experimentation/results required by the main challenge description."
          required: true
