name: "Submit: Quantum Circuit Golf"
description: Optimization / Circuits challenge
title: "[Circuit Golf] "
labels: ["submission", "circuit-golf"]
body:
  - type: markdown
    attributes:
      value: |
        **Deadline: Sunday, November 22, 11:00 AM.** Only one person needs to submit per team.
        Even if you haven't completed this challenge, feel free to submit what you have! 
        We will judge whatever you submit by 11:00 AM so you can keep pushing until then.

  - type: dropdown
    id: track
    attributes:
      label: Track
      options:
        - Quantum Circuit Golf
      default: 0
    validations:
      required: true

  - type: input
    id: team
    attributes:
      label: Team name
    validations:
      required: true

  - type: textarea
    id: members
    attributes:
      label: Team members
      description: One per line.
    validations:
      required: true

  - type: input
    id: repo
    attributes:
      label: Repository URL
      description: Make sure this is public so the judges can open it.
      placeholder: https://github.com/your-team/your-repo
    validations:
      required: true
