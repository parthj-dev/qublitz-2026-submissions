name: "Submit: Quantum Minesweeper"
description: Error correction challenge
title: "[Minesweeper] "
labels: ["submission", "minesweeper"]
body:
  - type: markdown
    attributes:
      value: |
        **Deadline: Sunday, November 22, 11:00 AM.** One submission per team.
        Even if you haven't completed this challenge, feel free to submit what you have! The results sections are optional but feel free to add them if you have completed
        those parts of the project. We will judge whatever you submit by 11:00 AM so feel free to keep pushing until then.

  - type: dropdown
    id: track
    attributes:
      label: Track
      options:
        - Quantum Minesweeper
      default: 0
    validations:
      required: true

  - type: input
    id: team
    attributes:
      label: Team name
    validations:
      required: true

  - type: textarea
    id: members
    attributes:
      label: Team members
      description:
    validations:
      required: true

  - type: input
    id: repo
    attributes:
      label: Repository URL
      description: 
      placeholder: https://github.com/your-team/your-repo
    validations:
      required: true

  - type: textarea
    id: results
    attributes:
      label: Challenge results
      description: >-
        A summary of completed levels, including simulation results and evidence that the proposed
        error-correction procedures work.
    validations:
      required: false

  - type: textarea
    id: iqm
    attributes:
      label: IQM implementation
      description: >-
        The circuit implemented on IQM quantum hardware, the corresponding experimental results, and a brief
        explanation of the observations.
    validations:
      required: false
