name: "Submit: Quantum Minesweeper"
description: Error correction challenge
title: "[Minesweeper] "
labels: ["submission", "minesweeper"]
body:
  - type: markdown
    attributes:
      value: |
        **Deadline: Sunday, November 22, 11:00 AM ET.** One submission per team.
        We'll judge what's on your repository's main branch at the deadline, so you can keep pushing until then.

  - type: dropdown
    id: track
    attributes:
      label: Track
      options:
        - Quantum Minesweeper
      default: 0
    validations:
      required: true

  - type: input
    id: team
    attributes:
      label: Team name
    validations:
      required: true

  - type: textarea
    id: members
    attributes:
      label: Team members
      description: One per line.
    validations:
      required: true

  - type: input
    id: repo
    attributes:
      label: Repository URL
      description: Make it public so the judges can open it.
      placeholder: https://github.com/your-team/your-repo
    validations:
      required: true

  - type: textarea
    id: results
    attributes:
      label: Challenge results
      description: >-
        A summary of completed levels, including simulation results and evidence that the proposed
        error-correction procedures work. Write it here, attach files, or tell us where to find it in your repository.
    validations:
      required: true

  - type: textarea
    id: iqm
    attributes:
      label: IQM implementation
      description: >-
        The circuit implemented on IQM quantum hardware, the corresponding experimental results, and a brief
        explanation of the observations. Write it here, attach files, or tell us where to find it in your repository.
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations
      description: From the Quantum Minesweeper challenge brief.
      options:
        - label: "Code repository: A GitHub repository containing the source code, quantum circuits, and instructions needed to reproduce the project."
          required: true
