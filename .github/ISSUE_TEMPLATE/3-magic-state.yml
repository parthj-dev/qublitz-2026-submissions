name: "Submit: Magic State Verification"
description: Theory / Algorithms challenge
title: "[Magic State] "
labels: ["submission", "magic-state"]
body:
  - type: markdown
    attributes:
      value: |
        **Deadline: Sunday, November 22, 11:00 AM.** Only one person needs to submit per team.
        Even if you haven't completed this challenge, feel free to submit what you have! We will judge whatever you submit by 11:00 AM so you can keep pushing until then.

  - type: dropdown
    id: track
    attributes:
      label: Track
      options:
        - Magic State Verification
      default: 0
    validations:
      required: true

  - type: input
    id: team
    attributes:
      label: Team name
    validations:
      required: true

  - type: textarea
    id: members
    attributes:
      label: Team members
      description:
    validations:
      required: true

  - type: input
    id: repo
    attributes:
      label: Repository URL
      description: Make sure this is public so the judges can open it.
      placeholder: https://github.com/your-team/your-repo
    validations:
      required: true

  - type: textarea
    id: results
    attributes:
      label: Results
      description: >-
        A concise notebook or report presenting experiments of the team’s choice and explaining what they
        demonstrate about the algorithm. You can tell us where to find it in the repository or attach it here.
    validations:
      required: true

  - type: textarea
    id: attribution
    attributes:
      label: Attribution
      description: >-
        References for any published methods, external code, or AI-generated work used in the submission.
        Write "None" if there aren't any.
    validations:
      required: true
