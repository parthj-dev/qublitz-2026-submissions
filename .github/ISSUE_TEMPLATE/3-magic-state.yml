name: "Submit: Magic State Verification"
description: Theory / Algorithms challenge
title: "[Magic State] "
labels: ["submission", "magic-state"]
body:
  - type: markdown
    attributes:
      value: |
        **Deadline: Sunday, November 22, 11:00 AM ET.** One submission per team.
        We'll judge what's on your repository's main branch at the deadline, so you can keep pushing until then.

  - type: dropdown
    id: track
    attributes:
      label: Track
      options:
        - Magic State Verification
      default: 0
    validations:
      required: true

  - type: input
    id: team
    attributes:
      label: Team name
    validations:
      required: true

  - type: textarea
    id: members
    attributes:
      label: Team members
      description: One per line.
    validations:
      required: true

  - type: input
    id: repo
    attributes:
      label: Repository URL
      description: Make it public so the judges can open it.
      placeholder: https://github.com/your-team/your-repo
    validations:
      required: true

  - type: textarea
    id: results
    attributes:
      label: Results
      description: >-
        A concise notebook or report presenting experiments of the team’s choice and explaining what they
        demonstrate about the algorithm. Tell us where to find it in your repository, or attach it here.
    validations:
      required: true

  - type: textarea
    id: attribution
    attributes:
      label: Attribution
      description: >-
        References for any published methods, external code, or AI-generated work used in the submission.
        Write "None" if there aren't any.
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations
      description: From the Magic State Verification challenge brief.
      options:
        - label: "GitHub repository: the complete working implementation, dependencies, and run instructions."
          required: true
